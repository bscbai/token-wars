<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Wars: 算力征途</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), 0 0 80px rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.2);
    }
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font-size: 18px;
      text-align: center;
      z-index: 1000;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(0, 255, 136, 0.2);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading .error {
      color: #ff6666;
      font-size: 14px;
      margin-top: 12px;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>正在加载 Token Wars...</div>
    <div class="error" id="loading-error" style="display:none;"></div>
  </div>
  <div id="game-container"></div>

  <!-- Dependencies (local first, CDN fallback) -->
  <script src="/lib/phaser.min.js"></script>
  <script src="/lib/socket.io.min.js"></script>

  <!-- Shared Constants (Browser version) -->
  <script src="/shared/constants.js"></script>

  <!-- Game Systems -->
  <script src="/src/systems/NetworkManager.js"></script>

  <!-- Game Scenes -->
  <script src="/src/scenes/LobbyScene.js"></script>
  <script src="/src/scenes/CombatScene.js"></script>
  <script src="/src/scenes/AIArenaScene.js"></script>

  <script>
    (function() {
      var loadingEl = document.getElementById('loading');
      var errorEl = document.getElementById('loading-error');

      function showError(msg) {
        if (errorEl) {
          errorEl.style.display = 'block';
          errorEl.textContent = msg;
        }
        console.error('[Token Wars] Load error:', msg);
      }

      function hideLoading() {
        if (loadingEl) {
          loadingEl.style.transition = 'opacity 0.5s';
          loadingEl.style.opacity = '0';
          setTimeout(function() {
            if (loadingEl && loadingEl.parentNode) {
              loadingEl.parentNode.removeChild(loadingEl);
            }
          }, 600);
        }
      }

      // Verify critical libraries loaded
      if (typeof Phaser === 'undefined') {
        showError('Phaser 加载失败 — 请检查 /lib/phaser.min.js');
        return;
      }
      if (typeof window.io === 'undefined') {
        showError('Socket.IO 加载失败 — 请检查 /lib/socket.io.min.js');
        return;
      }
      if (typeof window.TokenWars === 'undefined') {
        showError('Constants 加载失败 — 请检查 /shared/constants.js');
        return;
      }
      if (typeof LobbyScene === 'undefined') {
        showError('LobbyScene 加载失败 — 请检查 /src/scenes/LobbyScene.js');
        return;
      }

      try {
        var config = {
          type: Phaser.AUTO,
          width: 1024,
          height: 768,
          parent: 'game-container',
          backgroundColor: '#0a0a12',
          scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
          },
          scene: [LobbyScene, CombatScene, AIArenaScene],
          physics: {
            default: 'arcade',
            arcade: {
              gravity: { y: 0 },
              debug: false,
            },
          },
          render: {
            pixelArt: false,
            antialias: true,
          },
        };

        var game = new Phaser.Game(config);

        // Hide loading once first scene's create() runs (more reliable than 'ready')
        function tryHide() {
          // Check if a Phaser canvas has been created and any scene is active
          var canvas = document.querySelector('#game-container canvas');
          if (canvas) {
            hideLoading();
            return true;
          }
          return false;
        }

        // Poll for canvas creation (max 5s)
        var pollCount = 0;
        var pollInterval = setInterval(function() {
          if (tryHide() || pollCount++ > 50) {
            clearInterval(pollInterval);
          }
        }, 100);

        // Fallback: hide after 3 seconds no matter what
        setTimeout(hideLoading, 3000);

        // Also hide on 'ready' event
        game.events.once('ready', hideLoading);
        game.events.on('ready', hideLoading);

        console.log('[Token Wars] Game initialized successfully');
      } catch (e) {
        showError('Phaser 初始化失败: ' + e.message);
        console.error(e);
      }
    })();
  </script>
</body>
</html>
