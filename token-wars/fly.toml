# Token Wars — Fly.io Deployment Config
# Deploy: fly launch --name token-wars --org personal
#         fly deploy

app = "token-wars"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Persistent SQLite. Create the volume before the first deploy:
#   fly volumes create tokenwars_data --size 1
# Without this mount every deploy/restart wipes all players and match archives.
[[mounts]]
  source = "tokenwars_data"
  destination = "/app/server/data"
