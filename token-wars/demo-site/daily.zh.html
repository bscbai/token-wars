<script>
const D = {"epoch":1767225600000,"maps":[{"id":"data_mine","name":"数据矿洞"},{"id":"compute_square","name":"算力广场"},{"id":"cache_maze","name":"缓存迷宫"},{"id":"arena_dome","name":"竞技穹顶"},{"id":"data_torrent","name":"数据洪流"}],"muts":[{"id":"blitz","label":"极速 60 秒"},{"id":"glass","label":"玻璃 60 血"},{"id":"guarded","label":"对手带盾"},{"id":"fierce","label":"狂暴 AI"},{"id":"fragile","label":"脆弱：你只有 60 血"}],"s":{"htmlLang":"zh-CN","title":"Token Wars 每日挑战——每天一张地图与一条规则变体","description":"每天一张竞技场 + 一条规则变体：打赢守门 AI、记录最佳用时、分享战绩图，或用你自己的 decide(state) agent 跑同一套挑战。","kicker":"每日挑战","todayLabel":"今天","play":"▶ 挑战今天","bot":"用 bot 跑一遍","bestNone":"今天还没挑战——最佳用时会显示在这里。","bestWin":"今日最佳：{t} 秒。","bestLoss":"今天已挑战，尚无胜场。","scheduleTitle":"未来 7 天","colDate":"日期","colNo":"期数","colMap":"竞技场","colRule":"规则变体","todayTag":"今天","howTitle":"怎么玩","how1":"每天所有人拿到同一张地图与同一条规则变体。","how2":"最佳用时与尝试次数只保存在你的浏览器（localStorage）。","how3":"分享战绩或战绩图——朋友打开就是同一套配置。","shareText":"Token Wars 每日挑战：每天一张地图 + 一条规则变体，打赢守门 AI 再分享战绩图。","otherLang":"EN","otherHref":"./daily.html","footerHome":"录制对局","footerPlay":"对战内置 AI","footerBot":"写个 agent","footerGitHub":"GitHub"}};
const $ = (id) => document.getElementById(id);
const dayOf = (d) => Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - D.epoch) / 86400000);
const infoOf = (d) => {
  const day = dayOf(d);
  const mi = ((day % D.maps.length) + D.maps.length) % D.maps.length;
  const ri = ((Math.floor(day / D.maps.length) % D.muts.length) + D.muts.length) % D.muts.length;
  return { number: day + 1, map: D.maps[mi], mut: D.muts[ri] };
};
const now = new Date();
const today = infoOf(now);
$('todayNo').textContent = '#' + today.number;
$('todayMap').textContent = today.map.name;
$('todayMut').textContent = today.mut.label;

const key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')
  + '-' + String(now.getDate()).padStart(2, '0');
let rec = null;
try {
  const saved = JSON.parse(localStorage.getItem('tw-play-record-v1'));
  rec = saved && saved.daily && saved.daily[key];
} catch (e) { /* 隐私模式 */ }
if (!rec) $('best').textContent = D.s.bestNone;
else if (rec.won > 0) $('best').textContent = D.s.bestWin.replace('{t}', (rec.bestMs / 1000).toFixed(1));
else $('best').textContent = D.s.bestLoss;

const head = '<tr><th>' + D.s.colDate + '</th><th>' + D.s.colNo + '</th><th>'
  + D.s.colMap + '</th><th>' + D.s.colRule + '</th></tr>';
const rows = [];
for (let i = 0; i < 7; i++) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
  const info = infoOf(d);
  const date = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  rows.push('<tr' + (i === 0 ? ' class="is-today"' : '') + '><td>' + date
    + (i === 0 ? '<span class="daily-badge">' + D.s.todayTag + '</span>' : '')
    + '</td><td>#' + info.number + '</td><td>' + info.map.name + '</td><td>'
    + info.mut.label + '</td></tr>');
}
$('schedule').innerHTML = '<table class="schedule"><thead>' + head + '</thead><tbody>'
  + rows.join('') + '</tbody></table>';
</script>
