name: Pages

# 把静态演示站自动发布到 GitHub Pages（每次 main 更新 + 手动触发）。
# 生成方式与本地一致：npm run demo:static（含试玩页、Agent 沙盒、单场分享页）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-wars/package-lock.json

      - working-directory: token-wars
        run: npm ci

      - working-directory: token-wars
        run: npm run demo:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: token-wars/demo-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
