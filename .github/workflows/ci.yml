name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-wars/package-lock.json
      - working-directory: token-wars
        run: npm ci
      - working-directory: token-wars
        run: npm test

  # Real-process smoke test: boots the server, runs the sample bot and requires
  # two completed matches + replay frames + the share page. This catches
  # regressions the unit suite cannot see (boot errors, queue stalls, missing
  # replay data, broken share markup).
  demo-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-wars/package-lock.json
      - working-directory: token-wars
        run: npm ci
      - working-directory: token-wars
        run: node scripts/smoke-demo.cjs

  # Build the GitHub Pages demo and let its self-check fail the job: the
  # generated index, benchmark and per-match share pages must keep OG tags and
  # replay data or shared links silently break.
  static-demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-wars/package-lock.json
      - working-directory: token-wars
        run: npm ci
      - working-directory: token-wars
        run: npm run demo:static
      - working-directory: token-wars
        run: |
          test -s demo-site/index.html
          test -s demo-site/benchmark.html
          test -s demo-site/replay.js
          test -s demo-site/match-01.html

  # Smoke-test the Electron packaging pipeline. Non-blocking: packaging quirks
  # (icons, native rebuilds) shouldn't fail the test gate.
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: token-wars/package-lock.json
      - working-directory: token-wars
        run: npm ci
      - working-directory: token-wars
        run: node scripts/build-electron.js --linux
